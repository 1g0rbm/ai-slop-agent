[tools]
python = "3.12"
uv = "0.6.14"

[tasks.install]
description = "Установить зависимости проекта"
run = "uv sync --all-groups"

[tasks.run]
description = "Запустить интерактивный чат"
depends = ["install"]
run = "uv run agent-lvl"

[tasks.test]
description = "Запустить тесты"
depends = ["install"]
run = "uv run pytest"

[tasks.lint]
description = "Проверить стиль и форматирование проекта"
depends = ["install"]
run = "uv run ruff check . && uv run ruff format --check ."
